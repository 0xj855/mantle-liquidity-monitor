<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluxion RFQ SLA Record</title>
<meta name="description" content="Historical SLA track record of Fluxion RFQ market making on Mantle xStocks: quote uptime, benchmark pass rate, spreads and depth by session.">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --ring:rgba(11,11,11,.10); --hover:rgba(11,11,11,.04);
  --accent:#2a78d6; --heat-0:#eef3fb; --heat-1:#2a78d6; --empty:rgba(11,11,11,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
    --accent:#3987e5; --heat-0:#1c2533; --heat-1:#4c97ee; --empty:rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
  --accent:#3987e5; --heat-0:#1c2533; --heat-1:#4c97ee; --empty:rgba(255,255,255,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.back{color:var(--muted);font-size:13px;text-decoration:none}
.back:hover{color:var(--ink-2)}
h1{font-size:22px;font-weight:650;margin:4px 0 0;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin-top:2px;max-width:75ch}
.head-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.meta{color:var(--muted);font-size:13px;text-align:right}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--ring);border-radius:8px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;color:var(--ink-2);font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:550}
.filters{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:16px}
.filters .label{color:var(--muted);font-size:12px}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:5px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px}
.tile .k{color:var(--ink-2);font-size:13px}
.tile .v{font-size:24px;font-weight:620;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .d{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;margin-bottom:16px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.card h2{font-size:15px;font-weight:620;margin:0 0 2px}
.card .desc{color:var(--muted);font-size:12.5px;margin:0 0 12px;max-width:95ch}
.btn{border:1px solid var(--ring);background:none;color:var(--ink-2);font:inherit;font-size:12.5px;padding:4px 10px;border-radius:7px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--hover)}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:550;font-size:12px}
th:first-child,td:first-child{text-align:left}
td .small{display:block;color:var(--muted);font-size:11.5px}
.rate{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.rate i{display:inline-block;width:48px;height:6px;border-radius:3px;background:var(--empty);position:relative;overflow:hidden}
.rate i b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.tier{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;border:1px solid var(--ring);color:var(--ink-2);font-weight:600;margin-left:6px}
.heat{border-collapse:separate;border-spacing:2px;font-size:11px;width:auto}
.heat th,.heat td{padding:0;border:0}
.heat th{font-weight:500;color:var(--muted);padding:0 4px 2px;text-align:center}
.heat th.sym{text-align:left;padding-right:10px;color:var(--ink-2);font-size:12px}
.heat td{width:22px;min-width:22px;height:22px;border-radius:3px;text-align:center;color:transparent}
.heat td.none{background:var(--empty)}
.heat-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:10px}
.heat-legend i{display:inline-block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--heat-0),var(--heat-1))}
.files{display:flex;flex-wrap:wrap;gap:8px}
.empty{color:var(--muted);padding:24px 0;text-align:center}
footer{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="back" href="./" data-i18n="back"></a>
      <h1 data-i18n="title"></h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="head-r">
      <div class="seg" id="f-lang" aria-label="Language">
        <button data-v="zh" aria-pressed="false">中文</button>
        <button data-v="en" aria-pressed="false">EN</button>
      </div>
      <div class="meta" id="meta">…</div>
    </div>
  </header>

  <div class="filters" role="toolbar">
    <label class="label" for="f-period" data-i18n="period"></label>
    <select id="f-period"></select>
    <span class="label" data-i18n="session" style="margin-left:6px"></span>
    <div class="seg" id="f-sess">
      <button data-v="all" aria-pressed="true"></button>
      <button data-v="market_open" aria-pressed="false"></button>
      <button data-v="pre_post" aria-pressed="false"></button>
      <button data-v="weekend" aria-pressed="false"></button>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>
  <section class="card" id="table"></section>
  <section class="card" id="heat"></section>
  <section class="card" id="files"></section>
  <footer data-i18n="footer"></footer>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const state = { period: "30d", sess: "all", data: null };
const SESS = ["all", "market_open", "pre_post", "weekend"];

const I18N = {
  zh: {
    docTitle: "Fluxion RFQ SLA 执行记录", back: "← 返回流动性看板", title: "Fluxion RFQ SLA 执行记录",
    subtitle: d => `10 个指定 xStocks 的 RFQ 报价，约每 5 分钟采样一次，记录始于 ${d}（UTC）。达标 = 中价点差不超过该时段 Tier 基准上限；盘中缺报价计为不达标，盘前盘后与周末没有报价的样本不计入考核。`,
    period: "期间", session: "时段", p7: "近 7 天", p30: "近 30 天", month: m => m,
    sess: { all: "全部时段", market_open: "盘中", pre_post: "盘前盘后", weekend: "周末 / 休市" },
    loadFail: "数据加载失败：", unavailable: "本轮 SLA 汇总失败，暂不可用。", noData: "该期间还没有样本。", updated: "更新于 ",
    tSamples: "样本数", tSamplesD: n => `${n} 个标的`, tUp: "报价在线率", tUpD: "有报价的样本占比", tPass: "达标率", tPassD: "达标样本 / 考核样本",
    tMiss: "盘中缺报价", tMissD: "计为不达标的样本数",
    tblTitle: "按标的", tblDesc: "考核样本 = 全部样本 − 非盘中无报价样本。达标率 = 达标样本 / 考核样本；报价时达标率 = 达标样本 / 有报价样本。基准上限为期间内最后生效的值。点差为 $1k 档的中价点差（bps）。",
    csvBtn: "下载本表 CSV",
    cSym: "标的", cBm: "基准上限", cN: "样本", cElig: "考核样本", cUp: "在线率", cPass: "达标率", cPassQ: "报价时达标率", cWide: "超标", cNoBid: "缺卖价", cMiss: "盘中缺报价",
    cMid: "中价点差 中位 / P90", cDepth: "最大承接深度（中位）", bmVaries: "按时段",
    heatTitle: "逐日达标率", heatDesc: "每格是该标的当天（UTC）在所选时段的达标率；灰色表示当天该时段没有考核样本。", heatLo: "0%", heatHi: "100%",
    cell: (sym, d, p, n) => `${sym} ${d}：达标率 ${p}（${n} 个考核样本）`,
    filesTitle: "原始样本", filesDesc: "每轮每个标的一行，按 UTC 月份分文件，长期保留。", filesNone: "首个月度文件会在第一次提交后出现。",
    footer: "数据源：Fluxion RFQ 报价接口（$1k–$100k 各档询价），SLA 基准与 Tier 见仓库 config/config.json → rfq_sla。原始样本同时保存在仓库 sla-data 分支。",
  },
  en: {
    docTitle: "Fluxion RFQ SLA Record", back: "← Back to liquidity dashboard", title: "Fluxion RFQ SLA record",
    subtitle: d => `RFQ quotes for the 10 designated xStocks, sampled about every 5 minutes since ${d} (UTC). Pass = mid spread at or below the session's tier benchmark ceiling; missing quotes in market hours count as failures, and unquoted samples outside market hours are not assessed.`,
    period: "Period", session: "Session", p7: "Last 7 days", p30: "Last 30 days", month: m => m,
    sess: { all: "All sessions", market_open: "Market open", pre_post: "Pre / post", weekend: "Weekend / holiday" },
    loadFail: "Failed to load data: ", unavailable: "SLA summary failed this run and is temporarily unavailable.", noData: "No samples in this period yet.", updated: "Updated ",
    tSamples: "Samples", tSamplesD: n => `${n} tokens`, tUp: "Quote uptime", tUpD: "Share of samples with a quote", tPass: "Pass rate", tPassD: "Passing samples / assessed samples",
    tMiss: "Missing in market hours", tMissD: "Samples counted as failures",
    tblTitle: "By token", tblDesc: "Assessed samples = all samples minus unquoted samples outside market hours. Pass rate = passing / assessed; pass rate when quoted = passing / quoted. The benchmark ceiling is the last one in effect during the period. Spread is the $1k mid spread in bps.",
    csvBtn: "Download table CSV",
    cSym: "Token", cBm: "Benchmark ceiling", cN: "Samples", cElig: "Assessed", cUp: "Uptime", cPass: "Pass rate", cPassQ: "Pass rate when quoted", cWide: "Wide", cNoBid: "No bid", cMiss: "Missing (open)",
    cMid: "Mid spread median / P90", cDepth: "Max fill depth (median)", bmVaries: "By session",
    heatTitle: "Daily pass rate", heatDesc: "Each cell is the token's pass rate for that UTC day in the selected session; grey means no assessed samples.", heatLo: "0%", heatHi: "100%",
    cell: (sym, d, p, n) => `${sym} ${d}: pass rate ${p} (${n} assessed samples)`,
    filesTitle: "Raw samples", filesDesc: "One row per token per run, one file per UTC month, kept indefinitely.", filesNone: "The first monthly file appears after the first commit.",
    footer: "Source: Fluxion RFQ quote API ($1k–$100k probes). SLA benchmarks and tiers are in config/config.json → rfq_sla. Raw samples are also kept on the repository's sla-data branch.",
  },
};
const qsLang = new URLSearchParams(location.search).get("lang");
let saved = null; try { saved = localStorage.getItem("fluxmon.lang"); } catch (e) {}
let LANG = ["zh", "en"].includes(qsLang) ? qsLang : ["zh", "en"].includes(saved) ? saved : (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
const T = () => I18N[LANG];

const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? e.className = v : k === "text" ? e.textContent = v : e.setAttribute(k, v);
  for (const k of kids) if (k != null) e.append(k); return e; };
const rate = (a, b) => b ? a / b : null;
const elig = a => a.eligible ?? (a.n - (a.unquoted_off_hours || 0));   // 达标率分母：非盘中无报价不考核
const fmtPct = v => v == null ? "–" : (v * 100).toFixed(1) + "%";
const fmtBps = v => v == null ? "–" : v.toFixed(1);
const fmtUsd = v => v == null ? "–" : "$" + (v >= 1e3 ? (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + "K" : v.toFixed(0));
const day = ts => new Date(ts * 1000).toISOString().slice(0, 10);
const tierOrder = t => ({ "Tier 1": 1, "Tier 2": 2, "Tier 3": 3 })[t] || 9;
const rateCell = v => el("td", {}, el("span", { class: "rate" }, fmtPct(v), el("i", {}, el("b", { style: `width:${v == null ? 0 : (v * 100).toFixed(1)}%` }))));

function applyStatic() {
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.title = T().docTitle;
  for (const e of document.querySelectorAll("[data-i18n]")) e.textContent = T()[e.dataset.i18n];
  for (const b of document.querySelectorAll("#f-lang button")) b.setAttribute("aria-pressed", b.dataset.v === LANG);
  for (const b of document.querySelectorAll("#f-sess button")) b.textContent = T().sess[b.dataset.v];
}

function periodOptions() {
  const D = state.data, sel = $("#f-period");
  const opts = [["7d", T().p7], ["30d", T().p30], ...(D.months || []).map(m => ["m:" + m, T().month(m)])];
  sel.replaceChildren(...opts.map(([v, t]) => { const o = el("option", { value: v, text: t }); if (v === state.period) o.selected = true; return o; }));
}

function periodDays() {
  const D = state.data, end = day(D.ts);
  if (state.period.startsWith("m:")) {
    const m = state.period.slice(2), [y, mo] = m.split("-").map(Number), n = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    return Array.from({ length: n }, (_, i) => `${m}-${String(i + 1).padStart(2, "0")}`).filter(d => d <= end);
  }
  const n = state.period === "7d" ? 7 : 30, t = Date.parse(end + "T00:00:00Z");
  return Array.from({ length: n }, (_, i) => new Date(t - (n - 1 - i) * 86400e3).toISOString().slice(0, 10));
}

function rowsFor() {
  const P = (state.data.periods || {})[state.period] || {};
  return Object.entries(P).map(([sym, by]) => ({ sym, tier: state.data.tiers[sym], a: by[state.sess] }))
    .filter(r => r.a).sort((x, y) => tierOrder(x.tier) - tierOrder(y.tier) || x.sym.localeCompare(y.sym));
}

function render() {
  const D = state.data;
  if (!D) return;
  $("#meta").textContent = T().updated + new Date(D.ts * 1000).toLocaleString(LANG === "zh" ? "zh-CN" : "en-US");
  if (D.error) {
    for (const id of ["#tiles", "#table", "#heat", "#files", "#f-period"]) $(id).replaceChildren();
    $("#subtitle").textContent = "";
    $("#table").append(el("div", { class: "empty", text: T().unavailable })); return;
  }
  $("#subtitle").textContent = T().subtitle(D.first_ts ? day(D.first_ts) : "–");
  periodOptions();
  const rows = rowsFor();
  const sum = k => rows.reduce((s, r) => s + (r.a[k] || 0), 0);
  const N = sum("n");
  $("#tiles").replaceChildren(...[
    [T().tSamples, N.toLocaleString(), T().tSamplesD(rows.length)],
    [T().tUp, fmtPct(rate(sum("quoted"), N)), T().tUpD],
    [T().tPass, fmtPct(rate(sum("pass"), rows.reduce((s, r) => s + elig(r.a), 0))), T().tPassD],
    [T().tMiss, sum("missing_open").toLocaleString(), T().tMissD],
  ].map(([k, v, d]) => el("div", { class: "tile" }, el("div", { class: "k", text: k }), el("div", { class: "v", text: v }), el("div", { class: "d", text: d }))));

  const cols = [T().cSym, T().cBm, T().cN, T().cElig, T().cUp, T().cPass, T().cPassQ, T().cWide, T().cNoBid, T().cMiss, T().cMid, T().cDepth];
  const csvBtn = el("button", { class: "btn", type: "button", text: T().csvBtn });
  csvBtn.addEventListener("click", () => downloadCsv(cols, rows));
  $("#table").replaceChildren(el("div", { class: "card-head" }, el("h2", { text: T().tblTitle }), rows.length ? csvBtn : null), el("p", { class: "desc", text: T().tblDesc }),
    rows.length ? el("div", { class: "tablewrap" }, el("table", {},
      el("thead", {}, el("tr", {}, ...cols.map(c => el("th", { text: c })))),
      el("tbody", {}, ...rows.map(({ sym, tier, a }) => el("tr", {},
        el("td", {}, sym, el("span", { class: "tier", text: tier || "–" })),
        el("td", { text: state.sess === "all" ? T().bmVaries : a.bm_hi == null ? "–" : fmtBps(a.bm_hi) + " bps" }),
        el("td", { text: a.n.toLocaleString() }), el("td", { text: elig(a).toLocaleString() }),
        rateCell(rate(a.quoted, a.n)), rateCell(rate(a.pass, elig(a))), rateCell(rate(a.pass, a.quoted)),
        el("td", { text: a.wide }), el("td", { text: a.no_bid }), el("td", { text: a.missing_open }),
        el("td", { text: `${fmtBps(a.mid_med)} / ${fmtBps(a.mid_p90)}` }), el("td", { text: fmtUsd(a.depth_med) })))))) : el("div", { class: "empty", text: T().noData }));

  const days = periodDays(), syms = rows.map(r => r.sym);
  const heat = el("table", { class: "heat" }, el("thead", {}, el("tr", {}, el("th", {}), ...days.map(d => el("th", { text: d.slice(8) })))),
    el("tbody", {}, ...syms.map(sym => el("tr", {}, el("th", { class: "sym", text: sym }), ...days.map(d => {
      const a = (((D.daily || {})[d] || {})[sym] || {})[state.sess];
      if (!a || !elig(a)) return el("td", { class: "none", title: `${sym} ${d}: –` });
      const p = a.pass / elig(a);
      return el("td", { style: `background:color-mix(in srgb, var(--heat-1) ${(p * 100).toFixed(0)}%, var(--heat-0))`, title: T().cell(sym, d, fmtPct(p), elig(a)), text: Math.round(p * 100) });
    })))));
  $("#heat").replaceChildren(el("h2", { text: T().heatTitle }), el("p", { class: "desc", text: T().heatDesc }),
    syms.length ? el("div", { class: "tablewrap" }, heat) : el("div", { class: "empty", text: T().noData }),
    el("div", { class: "heat-legend" }, T().heatLo, el("i"), T().heatHi));

  const months = D.months || [];
  $("#files").replaceChildren(el("h2", { text: T().filesTitle }), el("p", { class: "desc", text: T().filesDesc }),
    months.length ? el("div", { class: "files" }, ...months.map(m => el("a", { class: "btn", href: `data/sla/${m}.csv`, download: `fluxion-rfq-sla-${m}.csv`, text: `${m}.csv` })))
      : el("div", { class: "empty", text: T().filesNone }));
}

function downloadCsv(cols, rows) {
  const q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  const r4 = v => v == null ? "" : (v * 100).toFixed(2);
  const lines = [["period", "session", "symbol", "tier", "bm_hi_bps", "samples", "assessed", "quoted", "pass", "wide", "no_bid", "missing_open", "uptime_pct", "pass_rate_pct", "pass_rate_quoted_pct", "mid_bps_median", "mid_bps_p90", "max_fill_usd_median"].join(",")];
  for (const { sym, tier, a } of rows)
    lines.push([state.period, state.sess, sym, tier, a.bm_hi ?? "", a.n, elig(a), a.quoted, a.pass, a.wide, a.no_bid, a.missing_open,
      r4(rate(a.quoted, a.n)), r4(rate(a.pass, elig(a))), r4(rate(a.pass, a.quoted)), a.mid_med ?? "", a.mid_p90 ?? "", a.depth_med ?? ""].map(q).join(","));
  const url = URL.createObjectURL(new Blob([lines.join("\n") + "\n"], { type: "text/csv" }));
  const link = el("a", { href: url, download: `fluxion-rfq-sla-${state.period.replace("m:", "")}-${state.sess}.csv` });
  document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function load() {
  try {
    const r = await fetch("data/sla.json?t=" + Math.floor(Date.now() / 60000));
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.data = await r.json(); render();
  } catch (e) { $("#meta").textContent = T().loadFail + e.message; }
}
$("#f-period").addEventListener("change", e => { state.period = e.target.value; render(); });
$("#f-sess").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  for (const x of $("#f-sess").querySelectorAll("button")) x.setAttribute("aria-pressed", x === b);
  state.sess = b.dataset.v; render(); });
$("#f-lang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.dataset.v === LANG) return;
  LANG = b.dataset.v; try { localStorage.setItem("fluxmon.lang", LANG); } catch (err) {}
  applyStatic(); render(); });
applyStatic(); load(); setInterval(load, 5 * 60 * 1000);
})();
