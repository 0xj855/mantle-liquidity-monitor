<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mantle Liquidity Monitor</title>
<meta name="description" content="Liquidity quality of xStocks and WETH pools on Fluxion V3 AMM (Mantle): depth, distribution, price impact, price deviation, LP concentration.">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --hover:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --good-text:#006300;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
    --s1:#3987e5; --s2:#d95926; --good-text:#0ca30c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --good-text:#0ca30c;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
h1{font-size:22px;font-weight:650;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);margin-top:2px}
.head-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.meta{color:var(--muted);font-size:13px;text-align:right}
.meta b{color:var(--ink-2);font-weight:550}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:8px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;color:var(--ink-2);font:inherit;font-size:13px;padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:550}
.filters .label{color:var(--muted);font-size:12px;margin-right:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:14px 16px}
.tile .k{color:var(--ink-2);font-size:13px}
.tile .v{font-size:24px;font-weight:620;margin-top:4px;letter-spacing:-.01em}
.tile .d{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:620;margin:0 0 2px}
.card .desc{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--grid)}
.alerts li:first-child{border-top:0}
.sev{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;min-width:72px;color:var(--ink-2)}
.sev i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:11px;color:#fff;font-weight:700}
.sev.critical i{background:var(--critical)} .sev.warn i{background:var(--warning);color:#0b0b0b} .sev.info i{background:var(--muted)}
.alerts .msg{color:var(--ink);word-break:break-word}
.ok{color:var(--good-text);font-weight:600}.bad{color:var(--critical);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;font-weight:600;line-height:1.4}
.tag.pass{background:rgba(16,185,129,.15);color:var(--good-text)}
.tag.wide{background:rgba(239,68,68,.15);color:var(--critical)}
.tag.missing_open{background:rgba(239,68,68,.15);color:var(--critical)}
.tag.no_bid{background:rgba(250,178,25,.2);color:var(--ink)}
.tag.unquoted_off_hours{background:var(--hover);color:var(--muted);border:1px solid var(--ring)}
.sess-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:6px 0 14px;padding:8px 12px;background:var(--hover);border:1px solid var(--ring);border-radius:8px;font-size:12.5px}
.sess-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sess-dot.open{background:var(--good);box-shadow:0 0 6px var(--good)}
.sess-dot.closed{background:var(--warning)}
.tier-tag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;border:1px solid var(--ring);color:var(--ink-2);font-weight:600}
.lbl{font-weight:600;margin-right:6px}
.coverage{color:var(--muted);font-size:12.5px;margin:-6px 0 14px}
.coverage b{color:var(--ink-2);font-weight:550}
.dexb{display:inline-block;font-size:11px;color:var(--ink-2);border:1px solid var(--ring);border-radius:5px;padding:0 5px;margin-right:6px;font-weight:500;vertical-align:1px}
.alerts .who{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.more{margin-top:8px}
.btn{border:1px solid var(--ring);background:none;color:var(--ink-2);font:inherit;font-size:13px;padding:5px 10px;border-radius:7px;cursor:pointer}
.btn:hover{background:var(--hover)}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:550;font-size:12px;cursor:pointer;user-select:none}
th[aria-sort] ::after{content:""}
th.sorted::after{content:" ▾";color:var(--ink-2)} th.sorted.asc::after{content:" ▴"}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--hover);box-shadow:inset 3px 0 0 var(--ink)}
.pair{font-weight:600}
.fee{color:var(--muted);font-size:12px;margin-left:6px}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2)}
.flag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.neg{color:var(--critical)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (max-width:820px){.grid2,.grid4{grid-template-columns:1fr}}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:2px}
.legend .ln{width:14px;height:2px;border-radius:1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);white-space:nowrap;z-index:5;opacity:0;transition:opacity .08s}
.tip .t{color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px}
.tip .r b{font-weight:650;color:var(--ink)}
.tip .r .ln{width:12px;height:2px;border-radius:1px;display:inline-block}
.tip .r span{color:var(--ink-2)}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.card-head a{color:var(--ink-2);font-size:12.5px}
.card-links{display:inline-flex;flex-wrap:wrap;gap:4px 14px}
.detail-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.detail-head h2{font-size:18px;margin:0}
.detail-head a{color:var(--muted);font-size:12px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.mini>div{border:1px solid var(--ring);border-radius:10px;padding:10px 12px}
.mini .k{color:var(--muted);font-size:12px}
.mini .v{font-size:17px;font-weight:620;margin-top:2px}
details{margin-top:8px}
summary{color:var(--ink-2);font-size:12.5px;cursor:pointer}
.empty{color:var(--muted);padding:24px 0;text-align:center}
footer{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.7}
footer code{font-size:11.5px}
.stale{color:var(--critical);font-weight:600}
.fade{opacity:.55;transition:opacity .2s}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title">Mantle 流动性监控</h1>

        <button data-v="en" aria-pressed="false">EN</button>
      </div>
      <div class="meta" id="meta">…</div>
    </div>

  <div class="filters" role="toolbar" data-i18n-aria="filters" aria-label="Filters">
    <span class="label">DEX</span>
    <div class="seg" id="f-dex">

  <section class="card">

    <ul class="alerts" id="alerts"></ul>

  <section class="card" id="lpmix"></section>

  <section class="card" id="rfq"></section>

  <section class="card" id="venue"></section>

  <section class="card" id="flows"></section>

  <section class="card">
    <h2 data-i18n="poolsTitle">池子总览</h2>
    <p class="desc" data-i18n="poolsDesc"></p>
    <div class="tablewrap"><table id="pools"><thead></thead><tbody></tbody></table></div>
  </section>

  <section class="card" id="detail"></section>

  <footer data-i18n-html="footer"></footer>
</div>

function frame(container, h, pad) {
  const w = Math.max(280, container.clientWidth || 600);
  const svg = s("svg", { viewBox: `0 0 ${w} ${h}`, height: h, role: "img" });
  return { svg, w, h, x0: pad.l, x1: w - pad.r, y0: h - pad.b, y1: pad.t };
}
function niceTicks(max, n = 4) {
  if (!(max > 0)) return [0, 1];
  const raw = max / n, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= raw);
  const out = []; for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}
function yAxis(f, ticks, fmt, ymax) {
  const g = s("g");
  for (const t of ticks) {
    const y = f.y0 - (t / ymax) * (f.y0 - f.y1);
    g.append(s("line", { x1: f.x0, x2: f.x1, y1: y, y2: y, stroke: t === 0 ? css("--axis") : css("--grid"), "stroke-width": 1 }));
    const tx = s("text", { x: f.x0 - 6, y: y + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted") }); tx.textContent = fmt(t); g.append(tx);
  }
  return g;
}
function tipBox(container) {
  container.style.position = "relative";
  const t = el("div", { class: "tip", role: "status" }); container.append(t); return t;
}
function showTip(tip, container, x, y, title, rows) {
  tip.replaceChildren(el("div", { class: "t", text: title }), ...rows.map(([c, v, n]) => el("div", { class: "r" },
    el("i", { class: "ln", style: `background:${c}` }), el("b", { text: v }), el("span", { text: n }))));
  tip.style.opacity = 1;
  const cw = container.clientWidth, tw = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(0, x + 12), cw - tw) + "px"; tip.style.top = Math.max(0, y - 10) + "px";
}

function distChart(card, p) {
  card.append(el("h2", { text: T().distTitle }), el("p", { class: "desc", text: T().distDesc(p.quote, p.base) }));
  card.append(el("div", { class: "legend" }, el("span", {}, el("i", { class: "sw", style: `background:${css("--s1")}` }), T().bidsBelow), el("span", {}, el("i", { class: "sw", style: `background:${css("--s2")}` }), T().asksAbove)));
  const c = el("div", { class: "chart" }); card.append(c);
  const bins = [];
  for (let i = 30; i >= 1; i--) bins.push({ lo: -i, hi: -i + 1, v: p.curve.down[i] - p.curve.down[i - 1], side: "down" });
  for (let i = 1; i <= 30; i++) bins.push({ lo: i - 1, hi: i, v: p.curve.up[i] - p.curve.up[i - 1], side: "up" });
  const f = frame(c, 240, { l: 52, r: 8, t: 10, b: 26 });
  const ymax = Math.max(...bins.map(b => b.v), 1); const ticks = niceTicks(ymax); const top = ticks[ticks.length - 1];
  f.svg.append(yAxis(f, ticks, v => "$" + compact(v), top));
  const bw = (f.x1 - f.x0) / bins.length, barW = Math.max(1, Math.min(24, bw - 2));
  const tip = tipBox(c);
  bins.forEach((b, i) => {
    const h = (b.v / top) * (f.y0 - f.y1), x = f.x0 + i * bw + (bw - barW) / 2, y = f.y0 - h;
    const r = Math.min(4, barW / 2, h);
    const path = h > 0 ? `M${x},${f.y0}V${y + r}Q${x},${y} ${x + r},${y}H${x + barW - r}Q${x + barW},${y} ${x + barW},${y + r}V${f.y0}Z` : "";
    const g = s("g", { tabindex: "0", "aria-label": T().binAria(b.lo, b.hi, "$" + compact(b.v)) });
    if (path) g.append(s("path", { d: path, fill: css(b.side === "up" ? "--s2" : "--s1") }));
    const hit = s("rect", { x: f.x0 + i * bw, y: f.y1, width: bw, height: f.y0 - f.y1, fill: "transparent" });
    g.append(hit);
    const on = e => { const rc = c.getBoundingClientRect(); const px = (e.clientX ?? (rc.left + x)) - rc.left;
      g.firstChild.setAttribute?.("opacity", path ? .8 : 1);
      showTip(tip, c, px, 10, `${b.lo > 0 ? "+" : ""}${b.lo}% ～ ${b.hi > 0 ? "+" : ""}${b.hi}%（${price(p.price * (1 + b.lo / 100))} – ${price(p.price * (1 + b.hi / 100))}）`,
        [[css(b.side === "up" ? "--s2" : "--s1"), "$" + compact(b.v), b.side === "up" ? T().askRes : T().bidRes]]); };
    const off = () => { tip.style.opacity = 0; if (path) g.firstChild.setAttribute("opacity", 1); };
    g.addEventListener("pointermove", on); g.addEventListener("focus", on); g.addEventListener("pointerleave", off); g.addEventListener("blur", off);
    f.svg.append(g);
  });
  const mid = f.x0 + 30 * bw;
  f.svg.append(s("line", { x1: mid, x2: mid, y1: f.y1 - 4, y2: f.y0, stroke: css("--ink-2"), "stroke-width": 1 }));
  for (const [v, anchor] of [[-30, "start"], [-10, "middle"], [0, "middle"], [10, "middle"], [30, "end"]]) {
    const x = f.x0 + (v + 30) * bw; const t = s("text", { x, y: f.h - 6, "text-anchor": anchor, "font-size": 11, fill: css("--muted") });
    t.textContent = v === 0 ? T().spot : (v > 0 ? "+" : "") + v + "%"; f.svg.append(t);
  }
  c.prepend(f.svg);
  const tbl = el("table"); tbl.append(el("thead", {}, el("tr", {}, el("th", { text: T().priceRange }), el("th", { text: T().reserveValue }))));
  tbl.append(el("tbody", {}, ...bins.filter(b => b.v > 0.5).map(b => el("tr", {}, el("td", { text: `${b.lo}% ～ ${b.hi}%` }), el("td", { text: "$" + compact(b.v) })))));
  card.append(el("details", {}, el("summary", { text: T().viewTable }), el("div", { class: "tablewrap" }, tbl)));
}

function lineChart(c, series, xs, opts) {
  const f = frame(c, opts.h || 200, { l: 52, r: opts.endLabels ? 64 : 12, t: 10, b: 24 });
  const vals = series.flatMap(sr => sr.ys).filter(v => v != null && isFinite(v));
  let lo = opts.zero ? 0 : Math.min(...vals), hi = Math.max(...vals);
  if (!vals.length) { c.replaceChildren(el("div", { class: "empty", text: T().noData })); return; }
  let ticks, top, bottom;
  if (opts.zero) { ticks = niceTicks(hi); top = ticks[ticks.length - 1]; bottom = 0; }
  else { const span = (hi - lo) || Math.abs(hi) * .1 || 1; bottom = lo - span * .15; top = hi + span * .15; ticks = [0, 1, 2, 3].map(i => bottom + (top - bottom) * i / 3); }
  const Y = v => f.y0 - (v - bottom) / (top - bottom) * (f.y0 - f.y1);
  const xmin = xs[0], xmax = xs[xs.length - 1]; const X = v => f.x0 + (xmax === xmin ? .5 : (v - xmin) / (xmax - xmin)) * (f.x1 - f.x0);
  const g = s("g");
  for (const t of ticks) {
    g.append(s("line", { x1: f.x0, x2: f.x1, y1: Y(t), y2: Y(t), stroke: (opts.zero && t === 0) ? css("--axis") : css("--grid"), "stroke-width": 1 }));
    const tx = s("text", { x: f.x0 - 6, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted") }); tx.textContent = opts.yfmt(t); g.append(tx);
  }
  if (!opts.zero && bottom < 0 && top > 0) g.append(s("line", { x1: f.x0, x2: f.x1, y1: Y(0), y2: Y(0), stroke: css("--axis"), "stroke-width": 1 }));
  f.svg.append(g);
  for (const [i, xv] of opts.xticks(xs).entries()) {
    const t = s("text", { x: X(xv.v), y: f.h - 6, "text-anchor": i === 0 ? "start" : "middle", "font-size": 11, fill: css("--muted") }); t.textContent = xv.label; f.svg.append(t);
  }
  for (const sr of series) {
    let d = "", pen = false;
    sr.ys.forEach((v, i) => { if (v == null || !isFinite(v)) { pen = false; return; } d += (pen ? "L" : "M") + X(xs[i]).toFixed(1) + "," + Y(v).toFixed(1); pen = true; });
    if (opts.area && series.length === 1) {
      const pts = sr.ys.map((v, i) => [xs[i], v]).filter(([, v]) => v != null);
      if (pts.length > 1) f.svg.append(s("path", { d: `M${X(pts[0][0])},${Y(bottom)}` + pts.map(([x, v]) => `L${X(x)},${Y(v)}`).join("") + `L${X(pts[pts.length - 1][0])},${Y(bottom)}Z`, fill: sr.color, opacity: .1 }));
    }
    f.svg.append(s("path", { d, fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const li = sr.ys.map((v, i) => v != null ? i : -1).filter(i => i >= 0).pop();
    if (li != null) {
      f.svg.append(s("circle", { cx: X(xs[li]), cy: Y(sr.ys[li]), r: 4, fill: sr.color, stroke: css("--surface"), "stroke-width": 2 }));
      if (opts.endLabels) { const t = s("text", { x: X(xs[li]) + 8, y: Y(sr.ys[li]) + 4, "font-size": 11.5, fill: css("--ink-2") }); t.textContent = opts.yfmt(sr.ys[li]); f.svg.append(t); }
    }
  }
  // crosshair
  const cross = s("line", { y1: f.y1, y2: f.y0, stroke: css("--axis"), "stroke-width": 1, opacity: 0 }); f.svg.append(cross);
  const dots = series.map(sr => { const d = s("circle", { r: 4, fill: sr.color, stroke: css("--surface"), "stroke-width": 2, opacity: 0 }); f.svg.append(d); return d; });
  const hit = s("rect", { x: f.x0, y: f.y1, width: f.x1 - f.x0, height: f.y0 - f.y1, fill: "transparent", tabindex: "0" }); f.svg.append(hit);
  const tip = tipBox(c);
  let idx = xs.length - 1;
  const show = () => {
    const xv = X(xs[idx]); cross.setAttribute("x1", xv); cross.setAttribute("x2", xv); cross.setAttribute("opacity", 1);
    series.forEach((sr, k) => { const v = sr.ys[idx]; if (v == null) { dots[k].setAttribute("opacity", 0); return; } dots[k].setAttribute("cx", xv); dots[k].setAttribute("cy", Y(v)); dots[k].setAttribute("opacity", 1); });
    const scale = c.clientWidth / f.w;
    showTip(tip, c, xv * scale, 4, opts.xlabel(xs[idx]), series.map(sr => [sr.color, opts.yfmt(sr.ys[idx]), sr.name]));
  };
  hit.addEventListener("pointermove", e => { const r = f.svg.getBoundingClientRect(); const px = (e.clientX - r.left) * (f.w / r.width);
    let best = 0, bd = Infinity; xs.forEach((x, i) => { const d = Math.abs(X(x) - px); if (d < bd) { bd = d; best = i; } }); idx = best; show(); });
  hit.addEventListener("focus", show);
  hit.addEventListener("keydown", e => { if (e.key === "ArrowLeft") { idx = Math.max(0, idx - 1); show(); } if (e.key === "ArrowRight") { idx = Math.min(xs.length - 1, idx + 1); show(); } });
  const hide = () => { tip.style.opacity = 0; cross.setAttribute("opacity", 0); dots.forEach(d => d.setAttribute("opacity", 0)); };
  hit.addEventListener("pointerleave", hide); hit.addEventListener("blur", hide);
  c.prepend(f.svg);
}

function curveChart(card, p) {
  card.append(el("h2", { text: T().curveTitle }), el("p", { class: "desc", text: T().curveDesc }));
  const sr = [{ name: T().curveUp, color: css("--s2"), ys: p.curve.up }, { name: T().curveDown, color: css("--s1"), ys: p.curve.down }];
  card.append(el("div", { class: "legend" }, ...sr.map(x => el("span", {}, el("i", { class: "ln", style: `background:${x.color}` }), x.name))));
  const c = el("div", { class: "chart" }); card.append(c);
  const xs = p.curve.up.map((_, i) => i);
  lineChart(c, sr, xs, { h: 240, zero: true, endLabels: true, yfmt: v => "$" + compact(v),
    xticks: () => [0, 5, 10, 15, 20, 25, 30].map(v => ({ v, label: v + "%" })), xlabel: v => T().curveX(v) });
}

function historyBlock(p) {
  const wrap = el("div");
  wrap.append(el("h2", { text: T().histTitle }), el("p", { class: "desc", text: T().histDesc(state.range) }));
  const H = state.history?.pools?.[p.pool];
  if (!H || H.rows.length < 2) { wrap.append(el("div", { class: "empty", text: T().histWait })); return wrap; }
  const F = state.history.fields; const ix = k => F.indexOf(k);
  const cut = Date.now() / 1000 - state.range * 86400;
  const rows = H.rows.filter(r => r[0] >= cut);
  if (rows.length < 2) { wrap.append(el("div", { class: "empty", text: T().histFew })); return wrap; }
  const xs = rows.map(r => r[0]);
  const xticks = xsv => { const n = 4, out = []; for (let i = 0; i < n; i++) { const v = xsv[0] + (xsv[xsv.length - 1] - xsv[0]) * i / (n - 1); const label = tfmt(v, state.range); if (!out.length || out[out.length - 1].label !== label) out.push({ v, label }); } return out; };
  const xlabel = v => new Date(v * 1000).toLocaleString(T().locale, { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const charts = [
    { t: T().hDepth, ys: rows.map(r => r[ix("depth2_up")] == null ? null : Math.min(r[ix("depth2_up")], r[ix("depth2_down")])), fmt: v => "$" + compact(v), zero: true },
    { t: T().hTvl, ys: rows.map(r => r[ix("tvl_usd")]), fmt: v => "$" + compact(v), zero: true },
  ];
  const grid = el("div", { class: "grid2" });
  for (const ch of charts) {
    const box = el("div"); box.append(el("div", { class: "legend", style: "font-weight:600;color:var(--ink)" }, ch.t));
    const c = el("div", { class: "chart" }); box.append(c); grid.append(box);
    requestAnimationFrame(() => lineChart(c, [{ name: ch.t, color: css("--s1"), ys: ch.ys }], xs, { h: 170, zero: ch.zero, area: ch.zero, yfmt: ch.fmt, xticks, xlabel }));
  }
  wrap.append(grid);
  return wrap;
}

function lpBlock(p) {
  const wrap = el("div", { style: "margin-top:20px" });
  wrap.append(el("h2", { text: T().lpTitle }));
  const lp = p.lp;
  if (!lp) { wrap.append(el("div", { class: "empty", text: p.dex === "agni" ? T().lpNoneAgni : T().lpNone })); return wrap; }
  if (p.kind === "lb") {
    wrap.append(el("p", { class: "desc", text: T().lbHolders }));
    const t = el("table"); t.append(el("thead", {}, el("tr", {}, ...T().lbCols.map(x => el("th", { text: x })))));
    t.append(el("tbody", {}, ...(lp.holders || []).slice(0, 15).map(h => el("tr", {}, ownerCell(h.owner), el("td", { text: usd(h.usd) }), el("td", { text: pct(h.share_pct, 1) })))));
    wrap.append(el("div", { class: "tablewrap" }, t));
    return wrap;
  }
  wrap.append(el("p", { class: "desc", text: T().lpDesc(lp) }));
  const tbl = el("table");
  tbl.append(el("thead", {}, el("tr", {}, ...T().lpCols(p.base).map(t => el("th", { text: t })))));
  tbl.append(el("tbody", {}, ...lp.big_ranges.map(b => {
    const own = ownerCell(b.owner);
    const edge = v => { const td = el("td", { text: v == null ? "∞" : pct(v, 1) }); if (v != null && v < 3) td.className = "neg"; return td; };
    return el("tr", {}, own, el("td", { text: pct(b.share_pct, 1) }), el("td", { text: (b.full_range || ((b.base_up_to_edge_pct ?? Infinity) > 500 && (b.base_down_to_edge_pct ?? 100) > 95)) ? T().fullRange : T().concentrated }),
      edge(b.base_up_to_edge_pct), edge(b.base_down_to_edge_pct));
  })));
  wrap.append(el("div", { class: "tablewrap" }, tbl));
  return wrap;
}

// ---------- controls ----------
function seg(id, key, cast) {
  $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    for (const x of $(id).querySelectorAll("button")) x.setAttribute("aria-pressed", x === b);
    state[key] = cast(b.dataset.v); render(); });
}
const qsDex = new URLSearchParams(location.search).get("dex");
if (["fluxion", "moe", "agni"].includes(qsDex)) { state.dex = qsDex; for (const x of document.querySelectorAll("#f-dex button")) x.setAttribute("aria-pressed", x.dataset.v === qsDex); }
seg("#f-dex", "dex", String); seg("#f-group", "group", String); seg("#f-range", "range", Number);
$("#f-lang").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.dataset.v === LANG) return;
  LANG = b.dataset.v; try { localStorage.setItem("fluxmon.lang", LANG); } catch (err) {}
  applyStatic(); if (state.latest) render(); });
applyStatic();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => state.latest && renderDetail(), 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => state.latest && renderDetail());
load(); setInterval(load, 5 * 60 * 1000);
})();
