name: monitor

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub 允许的最小间隔；高峰期可能延迟几分钟
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write     # 仅 "Commit SLA data" 一步拿到 token（checkout 不保存凭据）
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # 邮件（Resend）：只发 critical（按 key 去重）+ 每日日报；未设置 API key / EMAIL_TO 时不发
      FLUXMON_RESEND_API_KEY: ${{ secrets.FLUXMON_RESEND_API_KEY }}
      FLUXMON_EMAIL_TO: ${{ secrets.FLUXMON_EMAIL_TO }}
      FLUXMON_EMAIL_FROM: ${{ secrets.FLUXMON_EMAIL_FROM }}
      # 站点地址：仓库变量 FLUXMON_SITE_URL（自定义域名），未设置时用默认的 github.io 地址；须以 / 结尾
      FLUXMON_DASHBOARD_URL: ${{ vars.FLUXMON_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # 监控脚本处理外部数据，不让它接触有写权限的 token

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SQLite（事件、LP 持仓、告警状态）通过 Actions cache 在多次运行之间续接
      - uses: actions/cache/restore@v4
        with:
          path: data/fluxmon.db
          key: fluxmon-db-${{ github.run_id }}
          restore-keys: fluxmon-db-

      # SLA 长期记录：sla-data 分支（只放月度 CSV 与已结束月份的汇总），以 worktree 挂在 sla-data/
      # 只有分支确实不存在时才新建；网络等错误直接失败，避免用空历史覆盖汇总
      - name: Checkout SLA data
        run: |
          set +e; git ls-remote --exit-code --heads origin sla-data >/dev/null; rc=$?; set -e
          if [ $rc -eq 0 ]; then
            git fetch --depth=1 origin sla-data
            git worktree add sla-data FETCH_HEAD
          elif [ $rc -eq 2 ]; then
            git worktree add --orphan -b sla-data sla-data
          else
            echo "cannot reach origin (ls-remote exit $rc)"; exit 1
          fi

      - name: Run monitor
        env:
          FLUXMON_LARK_WEBHOOK: ${{ secrets.FLUXMON_LARK_WEBHOOK }}
          # 私有配置（LP 标签、合同承诺等，格式同 config/private.json）只放 Secret，不进仓库；公开产物会脱敏
          FLUXMON_PRIVATE_CONFIG: ${{ secrets.FLUXMON_PRIVATE_CONFIG }}
          # 线上看板以这里为准：历史序列在缓存丢失时从 <站点>/data/history.json 续接
          FLUXMON_HISTORY_URL: ${{ env.FLUXMON_DASHBOARD_URL }}data/history.json
          FLUXMON_PUBLIC: "1"     # 产物会公开发布：报告里剥掉 LP 标签、合同承诺等私有字段
          FLUXMON_SLA_DIR: sla-data
        run: python -m fluxmon.main

      # 每小时提交一次（未提交的样本留在数据库缓冲里，下次一起追加）；跨日时立即提交
      - name: Commit SLA data
        id: commit_sla
        if: always()
        continue-on-error: true   # 推送失败不阻塞看板部署，由下一步发失败邮件
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sla-data
          git add -A
          git diff --cached --quiet && exit 0
          last=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          lastday=$(git log -1 --format=%cd --date=format-local:%Y-%m-%d 2>/dev/null || echo none)
          if [ $(( $(date +%s) - last )) -lt 3600 ] && [ "$lastday" = "$(TZ=UTC date +%Y-%m-%d)" ]; then exit 0; fi
          git -c user.name="mantle-liquidity-monitor" -c user.email="actions@users.noreply.github.com" commit -q -m "SLA samples $(date -u +%Y-%m-%dT%H:%MZ)"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:sla-data

      # 监控或 SLA 推送失败时发邮件（6 小时内只发一封）；必须在 cache save 之前，冷却时间才能存进数据库
      - name: Notify failure
        if: failure() || steps.commit_sla.outcome == 'failure'
        run: |
          python -m fluxmon.mailer failed "workflow run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/fluxmon.db
          key: fluxmon-db-${{ github.run_id }}

      - name: Build site
        run: |
          mkdir -p _site/data
          cp site/index.html site/flows.html site/sla.html _site/
          cp data/reports/latest.json data/reports/history.json data/reports/latest.md data/reports/counterparties.json data/reports/sla.json _site/data/
          mkdir -p _site/data/sla && cp sla-data/rfq/*.csv _site/data/sla/ 2>/dev/null || true   # 首次运行前还没有 CSV

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
